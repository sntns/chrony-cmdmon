[package]
name = "chrony-cmdmon"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "Async client for chronyd's command and monitoring protocol (tracking, sources, burst, reload sources, ...) over its Unix socket"
repository = "https://github.com/sntns/chrony-cmdmon"
license = "MIT OR Apache-2.0"
keywords = ["chrony", "ntp", "time", "chronyc"]
categories = ["network-programming", "date-and-time", "api-bindings"]
readme = "README.md"
homepage = "https://github.com/sntns/chrony-cmdmon"

[features]
# The `cmdmon` command line tool, chronyc's equivalent:
# `cargo install chrony-cmdmon --features cli`.
cli = ["tokio/rt", "tokio/macros"]

[[bin]]
name = "cmdmon"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["net", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt"] }
proptest = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Drives `cargo release` (see .github/workflows/release.yml): bumps the
# version, dates the changelog, publishes to crates.io, then pushes the
# commit and its `vX.Y.Z` tag.
[package.metadata.release]
publish = true
push = true
allow-branch = ["main"]
pre-release-commit-message = "chore: release v{{version}}"
tag-name = "v{{version}}"
tag-message = "v{{version}}"
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## Unreleased", replace = "## Unreleased\n\n## {{version}} - {{date}}", exactly = 1 },
]
