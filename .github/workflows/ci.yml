name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable, and the minimum supported version (rust-version).
        rust: [stable, "1.75"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features --locked
      - run: cargo test --all-targets --all-features --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Documentation
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # What crates.io will get (release.yml publishes it).
      - run: cargo package --locked

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-targets --all-features --locked --summary-only

  # The versions to test against, from ci/chrony-versions.txt.
  chrony-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "versions=$(jq -R . ci/chrony-versions.txt | jq -sc .)" >> "$GITHUB_OUTPUT"

  # The whole suite in Docker against each chronyd and chronyc built from
  # source: live reports and commands, and requests compared with that
  # chronyc's.
  chrony:
    name: chrony ${{ matrix.chrony }}
    needs: chrony-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chrony: ${{ fromJson(needs.chrony-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Test against chrony ${{ matrix.chrony }}
        run: ci/docker-test.sh ${{ matrix.chrony }}
