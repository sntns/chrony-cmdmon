name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.75"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal && rustup default ${{ matrix.rust }}
      - name: Build
        run: cargo build --all-targets --all-features --locked
      - name: Test
        run: cargo test --all-targets --all-features --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Documentation
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package
        run: cargo package --locked --allow-dirty

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --all-targets --all-features --locked --summary-only

  # The versions to test against, from ci/chrony-versions.txt.
  chrony-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "versions=$(jq -R . ci/chrony-versions.txt | jq -sc .)" >> "$GITHUB_OUTPUT"

  # The whole suite in Docker against each chronyd and chronyc built from
  # source: live reports and commands, and requests compared with that
  # chronyc's.
  chrony:
    name: chrony ${{ matrix.chrony }}
    needs: chrony-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chrony: ${{ fromJson(needs.chrony-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Test against chrony ${{ matrix.chrony }}
        run: ci/docker-test.sh ${{ matrix.chrony }}
